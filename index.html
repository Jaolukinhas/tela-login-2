<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login | JL</title>
</head>
<body>

    <!-- Tela de carregamento -->
    <div id="preloader">
        <div class="loader"></div>
    </div>
  

    <div class="login-container">
        <h2>Login</h2>
        <form id="login-form">
            <input class="caixas" type="email" id="email" placeholder="Digite seu e-mail" required>
            <input class="caixas" type="password" id="password" placeholder="Digite sua senha" required>
            <div class="checkbox-container">
                <input type="checkbox" id="remember" >
                <label for="remember">Manter-me conectado</label>
            </div>
            <button type="submit">Entrar</button>
            <p class="forgot-password">
                <a href="#">Esqueci a senha</a>
            </p>
        </form>
        <p id="message"></p>
    </div>

    
    <div id="resetModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>Recuperar Senha</h3>
            <p>Digite seu e-mail para receber um link de redefinição: </p>
            <input type="email" id="resetEmail" placeholder="Seu e-mail">
            <button id="sendReset">Enviar link</button>
            <p id="resetMessage"></p>
        </div>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
